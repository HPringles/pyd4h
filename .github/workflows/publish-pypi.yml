# Publishes pyd4h to PyPI when a GitHub Release is published.
#
# One-time PyPI setup (trusted publishing — no long-lived API token):
#   1. Create the pyd4h project on https://pypi.org (if it does not exist yet).
#   2. Project → Publishing → Add a new pending publisher (or trusted publisher):
#        PyPI project name: pyd4h
#        Owner: <your GitHub org or username>
#        Repository name: pyd4h  (or your repo name)
#        Workflow name: publish-pypi.yml
#        Environment name: pypi  (optional; omit on PyPI if you remove `environment` below)
#   3. Bump `version` in pyproject.toml before each release (PyPI rejects re-uploads).
#
# Manual run: Actions → Publish to PyPI → Run workflow (after creating a Release is preferred).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
